; D&D 5E Toolkit firmware
[platformio]
default_envs = cardputer-adv

; Shared by every environment
[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17 -Wall

; Cardputer ADV on Arduino core 3.x (pioarduino), the toolchain the Tab5 needs
[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-stamps3
upload_speed = 1500000
; this Cardputer, by USB serial number (survives ttyACM renumbering)
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:86:78-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:86:78-if00
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_CARDPUTER
lib_deps =
    m5stack/M5Cardputer@1.1.1

; Previous toolchain (Arduino core 2.0.14), kept until core 3 is proven on the device
[env:cardputer-adv-legacy]
platform = espressif32@6.6.0
board = m5stack-stamps3
upload_speed = 1500000
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:86:78-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_50:78:7D:CE:86:78-if00
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_CARDPUTER
lib_deps =
    m5stack/M5Cardputer@1.1.1
