<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D 5E Toolkit</title>
<style>
:root {
  --bg: #0e0c14; --bg2: #1c1826; --panel: #282234; --edge: #544664; --text: #e8e0d2; --dim: #8c8296;
  --gold: #e8b04a; --gold-dk: #8c6220; --blood: #c83034; --emerald: #3cc878; --arcane: #786ef0; --ice: #6ec8e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--ice); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; color: var(--gold); margin: 0; font-weight: bold; }
h2 { font-size: 1.35rem; margin-bottom: .6rem; }
h3 { font-size: 1.05rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: .35rem .75rem; cursor: pointer; }
button:hover { border-color: var(--gold); }
button.primary { background: var(--gold-dk); border-color: var(--gold); color: #fff; }
button.danger:hover { border-color: var(--blood); color: var(--blood); }
button.icon { padding: .15rem .45rem; background: none; border-color: transparent; color: var(--dim); }
button.icon:hover { color: var(--text); border-color: var(--edge); }
input[type=text], input[type=password], input[type=search], input[type=number], textarea, select {
  background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: .4rem .55rem; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
textarea { resize: vertical; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg2); border-bottom: 2px solid var(--gold-dk);
  display: flex; align-items: center; gap: 1rem; padding: .5rem 1rem; flex-wrap: wrap; }
header h1 { font-size: 1.2rem; white-space: nowrap; }
nav { display: flex; gap: .1rem; flex-wrap: wrap; flex: 1; }
nav a { color: var(--dim); padding: .3rem .55rem; border-radius: 6px; }
nav a.on { color: var(--gold); background: var(--panel); }
nav a:hover { text-decoration: none; color: var(--text); }
#conn { font-size: .8rem; color: var(--dim); }
#conn.bad { color: var(--blood); }
main { max-width: 1100px; margin: 0 auto; padding: 1rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--dim); }
.small { font-size: .85rem; }
.card { background: var(--bg2); border: 1px solid var(--edge); border-radius: 8px; padding: .8rem 1rem; }
.list { display: flex; flex-direction: column; gap: .4rem; }
.list > a.card { color: var(--text); display: block; }
.list > a.card:hover { border-color: var(--gold); text-decoration: none; }
.tag { display: inline-block; font-size: .75rem; padding: 0 .45rem; border-radius: 9px; border: 1px solid var(--edge); color: var(--dim); }
.tag.gold { color: var(--gold); border-color: var(--gold-dk); }
.tag.green { color: var(--emerald); border-color: #2a6a48; }
.st { font-size: .85rem; color: var(--dim); }
.st.err { color: var(--blood); }
.st.ok { color: var(--emerald); }
.cols { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; align-items: start; }
.cols > * { min-width: 0; }
@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; }
  header { flex-wrap: nowrap; gap: .5rem; padding: .4rem .6rem; }
  header h1 { font-size: 1rem; }
  nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  nav a { padding: .3rem .5rem; white-space: nowrap; }
  .toolbar { top: 44px; }
}
.toolbar { position: sticky; top: 52px; z-index: 4; background: var(--bg); padding: .5rem 0; margin-bottom: .5rem; }

/* outline editor */
.sec { margin-bottom: .8rem; }
.sec > .head { display: flex; align-items: baseline; gap: .5rem; cursor: pointer; padding: .3rem 0; border-bottom: 1px solid var(--edge); }
.sec > .head .hint { color: var(--dim); font-size: .85rem; flex: 1; }
.sec.closed > .body { display: none; }
.sec > .head::before { content: "\25BE"; color: var(--dim); width: 1em; }
.sec.closed > .head::before { content: "\25B8"; }
.item { display: flex; gap: .4rem; align-items: flex-start; padding: .25rem 0; }
.item input[type=checkbox] { margin-top: .6rem; accent-color: var(--emerald); width: 1.1rem; height: 1.1rem; }
.item textarea { min-height: 2.2rem; overflow: hidden; resize: none; }
.item.done textarea { color: var(--dim); text-decoration: line-through; }
.item .btns { display: flex; opacity: .35; }
.item:hover .btns, .item:focus-within .btns { opacity: 1; }
.add { display: flex; gap: .4rem; padding: .3rem 0 0 1.5rem; }
.add textarea { min-height: 2.2rem; resize: none; overflow: hidden; }

/* live table */
.combat { display: flex; flex-direction: column; gap: .35rem; }
.cmb { display: grid; grid-template-columns: 3rem 1fr auto; gap: .2rem .8rem; align-items: center; background: var(--bg2);
  border: 1px solid var(--edge); border-radius: 8px; padding: .5rem .8rem; }
.cmb.turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px #e8b04a44; }
.cmb.down { opacity: .45; }
.cmb .ini { font: bold 1.5rem Georgia, serif; color: var(--gold); text-align: center; grid-row: span 2; }
.cmb .nm { font-weight: 600; font-size: 1.1rem; }
.cmb .nm .tag { margin-left: .4rem; }
.cmb .ac { color: var(--dim); text-align: right; }
.cmb .hp { grid-column: 2 / 4; display: flex; gap: .6rem; align-items: center; }
.bar { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; max-width: 320px; }
.bar > div { height: 100%; }
.conds { grid-column: 2 / 4; display: flex; gap: .3rem; flex-wrap: wrap; }
.cond { font-size: .8rem; background: #3a2448; color: #e0c8f0; border-radius: 9px; padding: 0 .5rem; }
.rolls { display: flex; flex-direction: column; gap: .35rem; }
.roll { background: var(--bg2); border: 1px solid var(--edge); border-radius: 8px; padding: .45rem .8rem; display: grid;
  grid-template-columns: 1fr auto; gap: 0 .6rem; }
.roll .tot { font: bold 1.6rem Georgia, serif; grid-row: span 2; align-self: center; }
.roll.crit { border-color: var(--gold); } .roll.crit .tot { color: var(--gold); }
.roll.fumble { border-color: var(--blood); } .roll.fumble .tot { color: var(--blood); }
.roll.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: #4a3a20; } }
.live { display: grid; grid-template-columns: 1fr 320px; gap: 1.2rem; align-items: start; }
@media (max-width: 860px) { .live { grid-template-columns: 1fr; } }
body.tv { font-size: 20px; }
body.tv main { max-width: none; }
body.bare header { display: none; }

/* reference + files */
.results { max-height: 70vh; overflow: auto; }
.res { display: block; padding: .3rem .5rem; border-radius: 6px; color: var(--text); }
.res:hover, .res.on { background: var(--panel); text-decoration: none; }
.res .meta { color: var(--dim); font-size: .8rem; display: block; }
.entry dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem 1rem; margin: .5rem 0 1rem; }
.entry dt { color: var(--dim); text-transform: capitalize; }
.entry dd { margin: 0; }
.entry h4 { color: var(--gold); margin: 1rem 0 .3rem; text-transform: capitalize; font-family: Georgia, serif; }
.entry p { margin: .3rem 0; white-space: pre-wrap; }
.entry ul { margin: .3rem 0; padding-left: 1.3rem; }
.entry li { margin: .15rem 0; }
.entry .tbl { overflow-x: auto; margin: .5rem 0; }
.entry table { border-collapse: collapse; font-size: .92rem; }
.entry th, .entry td { border: 1px solid var(--edge); padding: .25rem .55rem; text-align: left; vertical-align: top; }
.entry th { background: var(--panel); color: var(--gold); font-weight: 600; }
.entry tr:nth-child(even) td { background: #ffffff06; }
.entry p.tcap { color: var(--gold); font-weight: 600; margin: .8rem 0 .2rem; }
.entry tr.sect td { background: var(--bg); color: var(--gold); font-weight: 600; }
table.files { width: 100%; border-collapse: collapse; }
table.files td { padding: .35rem .4rem; border-bottom: 1px solid var(--bg2); }
table.files tr:hover td { background: var(--bg2); }
table.files td.sz { color: var(--dim); text-align: right; white-space: nowrap; font-size: .85rem; }
table.files td.act { text-align: right; white-space: nowrap; }
.crumbs a, .crumbs span { margin-right: .3rem; }
.drop { border: 2px dashed var(--edge); border-radius: 8px; padding: .8rem; text-align: center; color: var(--dim); margin: .5rem 0; }
.drop.over { border-color: var(--gold); color: var(--gold); }
textarea.code { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; min-height: 70vh; white-space: pre; }
textarea.note { min-height: 65vh; font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; }
progress { width: 100%; accent-color: var(--gold); }

/* device apps */
button.on { border-color: var(--gold); color: var(--gold); background: #3a2c14; }
button.big { font-size: 1.15rem; padding: .45rem 1.4rem; }
.ctl { grid-column: 2 / 4; display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-top: .2rem; }
.ctl select { width: auto; padding: .25rem .4rem; }
.ctl .amt { width: 5rem; padding: .25rem .4rem; }
.cond.x { cursor: pointer; } .cond.x:hover { text-decoration: line-through; background: #5a2030; }
.shade { position: fixed; inset: 0; background: #000b; z-index: 30; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 4vh 1rem; }
.pop { position: relative; width: min(760px, 100%); }
.pop .close { position: absolute; right: .4rem; top: .4rem; font-size: 1.2rem; z-index: 1; }
.dice { display: grid; grid-template-columns: repeat(7, 1fr); gap: .4rem; }
@media (max-width: 560px) { .dice { grid-template-columns: repeat(4, 1fr); } }
.die { display: flex; flex-direction: column; align-items: center; padding: .7rem .2rem; font-size: 1.15rem; user-select: none; }
.die .cnt { font-size: .85rem; color: var(--gold); min-height: 1.1em; }
.die.on { border-color: var(--gold); background: #2e2416; }
.dmod { font: bold 1.2rem Georgia, serif; min-width: 2.5rem; text-align: center; }
.dres { text-align: center; margin-top: 1rem; }
.dtotal { font: bold 4rem Georgia, serif; color: var(--text); line-height: 1.1; }
.dtotal.crit { color: var(--gold); } .dtotal.fumble { color: var(--blood); }
.dtotal.spin { animation: tumble .5s ease-out; }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.3); opacity: 0; } 70% { transform: rotate(12deg) scale(1.1); } 100% { transform: none; } }
.macro button.grow { padding: .45rem .7rem; }
.tres { font-size: 1.1rem; }
ol.entries { padding-left: 1.4rem; } ol.entries li { margin: .2rem 0; } ol.entries li.on { color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; margin-bottom: .6rem; }
@media (max-width: 700px) { .stats { grid-template-columns: repeat(3, 1fr); } }
.stat { background: var(--bg2); border: 1px solid var(--edge); border-radius: 8px; padding: .4rem .3rem; text-align: center; }
.stat .sv { font: bold 1.6rem Georgia, serif; }
button.stat { color: inherit; } button.stat:hover { border-color: var(--gold); }
.tgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .4rem; }
.stat.gold .sv { color: var(--gold); } .stat.ice .sv { color: var(--ice); }
.hpcard { margin-bottom: .8rem; } .hpnum { font: bold 1.8rem Georgia, serif; }
.sheet { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; align-items: start; }
@media (max-width: 860px) { .sheet { grid-template-columns: 1fr; } }
.sheet-sec h3 { margin-bottom: .5rem; }
.abils { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.abil { text-align: center; background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: .4rem; }
.abil .am { font: bold 1.8rem Georgia, serif; }
.abil button { padding: .2rem .45rem; font-size: .85rem; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem; }
.skill, .atk { display: flex; justify-content: space-between; gap: .5rem; text-align: left; }
.skill.prof { border-color: var(--gold-dk); } .skill.prof b { color: var(--gold); }
.atk.dim, .spell.dim { opacity: .6; }
.res-row, .item-row, .spell { padding: .25rem 0; border-bottom: 1px solid var(--bg); }
.slots { display: flex; flex-direction: column; gap: .3rem; }
.uses { flex-wrap: wrap; gap: .3rem; margin: .3rem 0 .2rem; }
.spell { flex-wrap: wrap; }
.slot { display: flex; align-items: center; gap: .6rem; }
.pip-row { display: flex; gap: .25rem; flex: 1; }
.pip { width: .95rem; height: .95rem; border-radius: 50%; border: 2px solid var(--arcane); }
.pip.full { background: var(--arcane); }
.pip.extra { border-color: var(--gold); }
.pip.extra.full { background: var(--gold); }
.coins button { padding: .3rem .6rem; } .coins b { color: var(--gold); }
#rollpop { position: fixed; right: 1rem; bottom: 1rem; z-index: 25; display: flex; flex-direction: column; gap: .4rem; width: min(340px, calc(100vw - 2rem)); }
#rollpop .roll { display: block; box-shadow: 0 6px 20px #000a; }
.rp-title { display: flex; justify-content: space-between; align-items: center; }
.rp-line { display: grid; grid-template-columns: 1fr auto; gap: 0 .6rem; align-items: baseline; }
.rp-line .rp-tot { font: bold 1.5rem Georgia, serif; text-align: right; }
.rp-line .small { grid-column: 1 / 3; }
.xpbar { position: relative; height: 12px; background: var(--bg); border-radius: 6px; margin-top: .5rem; }
.xpbar > div { height: 100%; border-radius: 6px; }
.xpbar .tick { position: absolute; top: -3px; width: 2px; height: 18px; background: var(--dim); }
table.shop tr.sold td { opacity: .45; text-decoration: line-through; }
.fivemap { width: 100%; max-height: 160px; }
.fivemap line { stroke: var(--edge); stroke-width: 3; }
.fivemap circle { fill: var(--panel); stroke: var(--gold); stroke-width: 1.5; } .fivemap circle.boss { stroke: var(--blood); }
.fivemap text { fill: var(--text); font: bold 8px sans-serif; text-anchor: middle; }
a.button { display: inline-block; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: .35rem .75rem; color: var(--text); }
a.button.primary { background: var(--gold-dk); border-color: var(--gold); color: #fff; }
a.button:hover { text-decoration: none; border-color: var(--gold); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; align-content: start; }
@media (max-width: 560px) { .levels { grid-template-columns: repeat(2, 1fr); } }
.lvcard { color: var(--text); } .lvcard:hover { border-color: var(--gold); text-decoration: none; } .lvcard.today { border-color: var(--gold); }
.wfield { margin: .35rem 0; }
.wfield .wlabel { color: var(--gold); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
.wfield textarea { resize: none; overflow: hidden; min-height: 2.2rem; }
.die-btn { font-size: 1.1rem; }
.tabs { display: flex; gap: .3rem; margin-bottom: .8rem; flex-wrap: wrap; }
.tabs button { flex: 1; min-width: 6rem; }
.d23rooms { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 860px) { .d23rooms { grid-template-columns: 1fr; } }
.rgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .3rem; }
.rtile { min-width: 0; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; aspect-ratio: 1; padding: .25rem .35rem; color: var(--edge); background: var(--bg); }
.rtile.w { color: var(--text); background: var(--bg2); } .rtile.on { border-color: var(--gold); background: var(--panel); }
.rtile.boss b { color: var(--blood); }
.rtile .dots, .dot { display: inline-flex; gap: 2px; } .rtile i, i.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
.chip { border: 1px solid var(--edge); border-radius: 14px; padding: .15rem .6rem; cursor: pointer; }
.chip input { display: none; } .chip.on { border-color: var(--gold); color: var(--gold); }
.encrow { display: flex; gap: .8rem; align-items: flex-start; } .encrow.hit { border-color: var(--gold); }
.encn { font: bold 1.6rem Georgia, serif; color: var(--gold); width: 1.6rem; text-align: center; }
.chk { display: flex; gap: .7rem; align-items: center; } .chk.done b { color: var(--emerald); }
.chk input { width: 1.2rem; height: 1.2rem; accent-color: var(--emerald); } .chk .tick { width: 1.2rem; text-align: center; color: var(--emerald); }
.d23map { display: grid; grid-template-columns: 1fr 300px; gap: 1rem; align-items: start; }
@media (max-width: 860px) { .d23map { grid-template-columns: 1fr; } }
.d23wrap { padding: .4rem; background: #12141e; }
.d23svg { width: 100%; display: block; }
.d23svg .cor { stroke: #5a5246; stroke-width: 9; }
.d23svg .door { fill: #96602f; } .d23svg .door.d3 { fill: var(--arcane); } .d23svg .lock { fill: var(--gold); }
.d23svg .sec { fill: var(--arcane); font: bold 12px sans-serif; text-anchor: middle; }
.d23svg .rm { cursor: pointer; } .d23svg .rm rect { fill: #d6c49e; stroke: #3c2c22; stroke-width: 2; }
.d23svg .rm.dimr rect { fill: #9a8c72; }
.d23svg .rm text { fill: #3c2c22; font: bold 18px Georgia, serif; text-anchor: middle; }
.d23svg .rm.boss rect { stroke: var(--blood); stroke-width: 3; } .d23svg .rm.boss text { fill: #8c1c14; }
.d23svg .rm.fog rect { fill: #12141e; stroke: #76705e; } .d23svg .rm.fog text { fill: #76705e; }
.d23svg .up { fill: none; stroke: #3c2c22; stroke-width: 2.5; }
.d23svg .stairs rect { fill: #9a8c72; } .d23svg .stairs text { fill: var(--gold); font: 12px sans-serif; text-anchor: middle; }
.hexmap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1rem; align-items: start; }
@media (max-width: 900px) { .hexmap { grid-template-columns: 1fr; } }
.hexwrap { padding: .4rem; background: #12141e; }
.hexsvg { width: 100%; display: block; }
.hexsvg .hx { stroke: #1e2428; stroke-width: 1; cursor: pointer; } .hexsvg .hx:hover { stroke: var(--gold); stroke-width: 2; }
.hexsvg .hx.fog { fill: #12141e; stroke: #222636; } .hexsvg .hx.dim { filter: brightness(.6); }
.hexsvg text, .hextpl text { text-anchor: middle; pointer-events: none; } .hexsvg .gl { font-size: 13px; opacity: .55; } .hexsvg .ic { font-size: 17px; }
.hexsvg .rv line { stroke: #4a8cdc; stroke-width: 3.5; stroke-linecap: round; } .hexsvg .rd line { stroke: #96643c; stroke-width: 2.5; stroke-dasharray: 4 3; }
.hexsvg .sel { fill: none; stroke: var(--gold); stroke-width: 3; pointer-events: none; } .hexsvg .evt { fill: none; stroke: var(--blood); stroke-width: 3; pointer-events: none; }
.hexsvg .party { fill: var(--blood); stroke: #fff; stroke-width: 2; pointer-events: none; }
.hextpl { width: 130px; flex: none; } .hextpl polygon { stroke: #1e2428; } .hextpl .gl { font-size: 11px; opacity: .6; }
a.dicelink { border-bottom: 1px dashed var(--gold); color: var(--gold); }
#login { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 20; }
#login.show { display: flex; }
#login .card { width: min(340px, 90vw); text-align: center; }
#login input { font-size: 2rem; text-align: center; letter-spacing: .5rem; margin: 1rem 0; }
</style>
</head>
<body>
<header>
  <h1>D&amp;D 5E Toolkit</h1>
  <nav id="nav">
    <a href="#table">Table</a><a href="#campaign">Campaign</a><a href="#notes">Notes</a>
    <a href="#ref">Reference</a><a href="#files">Files</a><a href="#device">WiFi</a>
  </nav>
  <span id="conn"></span>
</header>
<main id="main"></main>
<div id="login"><form class="card" id="loginForm">
  <h2>Enter PIN</h2>
  <div class="muted">The 4-digit PIN is on the Cardputer's Web screen.</div>
  <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="8">
  <button class="primary" style="width:100%">Unlock</button>
  <div class="st err" id="loginErr"></div>
</form></div>
<script>
"use strict";
// ------------------------------------------------------------------ basics
const $ = (s, el = document) => el.querySelector(s);
const enc = encodeURIComponent;
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k === "value") e.value = v;
    else if (k in e && typeof v !== "string") e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }
function kb(n) { return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB"; }

let token = localStorage.getItem("tok") || "";
let loginWaiters = [];
function setConn(ok, msg) { const c = $("#conn"); c.textContent = msg || (ok ? "" : "offline"); c.className = ok ? "" : "bad"; }

async function api(path, opts = {}) {

async function showEntry(entry, src, off) {
  const txt = await api(`/api/rec?path=${enc(SRD + "/" + src + ".txt")}&off=${enc(off)}`).then(r => r.text());
  const kv = txt.split("\n").map(l => { const i = l.indexOf(": "); return i > 0 ? [l.slice(0, i), unesc(l.slice(i + 2))] : null; }).filter(Boolean);
  const ABIL = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
  for (const p of kv) if ((p[0] === "scores" || p[0] === "saves") && p[1].split(",").length === 6) p[1] = p[1].split(",").map((v, i) => ABIL[i] + " " + v).join("  ");
  for (let i = kv.length - 1; i >= 0; i--) if (/^roll\d+$/.test(kv[i][0])) kv.splice(i, 1);   // the Cardputer's quick-roll data
  for (const p of kv) if ((p[0] === "conc" || p[0] === "ritual") && p[1] === "1") p[1] = "Yes";
  // a class's level table is stored as cols + L1..L20 ("1".."9" are spell slot columns)
  const colsKv = kv.find(([k]) => k === "cols");
  let classTable = null;
  if (colsKv) {
    const head = colsKv[1].split("|").map(c => /^\d$/.test(c.trim()) ? "Slot " + c.trim() : c.trim());
    const rows = [head];
    for (let lv = 1; lv <= 20; lv++) { const r = kv.find(([k]) => k === "L" + lv); if (r) rows.push(r[1].split("|").map(c => c.trim())); }
    classTable = tableEl(rows);
    for (let i = kv.length - 1; i >= 0; i--) if (/^(cols|L\d+|equip_[a-z])$/.test(kv[i][0])) kv.splice(i, 1);
  }
  const name = (kv.find(([k]) => k === "name") || [, ""])[1];
  const short = kv.filter(([k, v]) => k !== "name" && v.length <= 70 && !v.includes("\n"));
  const long = kv.filter(([k, v]) => k !== "name" && (v.length > 70 || v.includes("\n")));
  entry.replaceChildren(h("div", {}, h("div", { class: "row" }, h("h2", { class: "grow" }, name),
      src === "monsters" && hasApp("Initiative") ? h("button", { onclick: async ev => {
        try { await app("Initiative", "monsters", { text: "1x " + name }); ev.target.textContent = "Added ✓"; } catch (e) { ev.target.textContent = e.message; }
      } }, "Add to the fight") : null),
    short.length ? h("dl", {}, short.map(([k, v]) => [h("dt", {}, label(k)), h("dd", {}, v)])) : null,
    classTable ? [h("h4", {}, "Class table"), classTable] : null,
    long.map(([k, v]) => [k === "text" ? null : h("h4", {}, label(k)), richText(v)])));
  diceLinks(entry, name);
}
// Dice in a text ("2d6 + 3", "1d20") become links that roll on the device.
function diceLinks(el, title) {
  const re = /\b\d*d(?:4|6|8|10|12|20|100)\b(?:\s*[+\u2212-]\s*\d+)?/g;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const parts = [], t = n.nodeValue;
    let at = 0;
    for (const m of t.matchAll(re)) {
      parts.push(t.slice(at, m.index));
      const expr = m[0].replace(/\u2212/g, "-").replace(/\s+/g, "");
      parts.push(h("a", { class: "dicelink", href: "#", title: "Roll " + expr, onclick: async ev => {
        ev.preventDefault();
        try { showRolls(title, await rollOn(title, [{ label: "", expr }])); } catch (e) { }
      } }, m[0]));
      at = m.index + m[0].length;
    }
    parts.push(t.slice(at));
    n.replaceWith(...parts);
  }
}

// ------------------------------------------------------------------ files
const TEXT_EXT = /\.(txt|idx|md|csv|json|ini|cfg|log)$/i;
async function viewFiles(main, parts) {
  const path = "/gmtools" + (parts.length ? "/" + parts.join("/") : "");
  const listing = await api("/api/ls?path=" + enc(path)).then(r => r.json());
  listing.sort((a, b) => b.d - a.d || a.n.localeCompare(b.n, undefined, { numeric: true }));
  const rel = p => p.replace(/^\/gmtools\/?/, "");
  const link = p => "#files/" + rel(p).split("/").filter(Boolean).map(enc).join("/");
  const crumbs = h("div", { class: "crumbs" });
  let acc = "";
  path.split("/").filter(Boolean).forEach((seg, i, all) => {
    acc += "/" + seg;
    crumbs.append(i < all.length - 1 ? h("a", { href: link(acc) }, seg) : h("b", {}, seg), i < all.length - 1 ? h("span", { class: "muted" }, "/") : "");
  });
  const prog = h("div");
  const fileInput = h("input", { type: "file", multiple: true, style: "display:none", onchange: () => upload([...fileInput.files]) });
  const drop = h("div", { class: "drop" }, "Drop files here to upload into this folder");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); });
  async function upload(files) {
    for (const f of files) {
      const bar = h("progress", { max: 1, value: 0 }), label = h("div", { class: "small" }, `${f.name} (${kb(f.size)})`);
      prog.append(label, bar);
      const ok = await new Promise(res => {
        const x = new XMLHttpRequest(), fd = new FormData();
        fd.append("f", f, f.name);
        x.open("POST", "/api/upload?dir=" + enc(path));
        x.setRequestHeader("X-Token", token);
        x.upload.onprogress = e => { if (e.lengthComputable) bar.value = e.loaded / e.total; };
        x.onload = () => res(x.status === 200 ? "" : (x.status === 401 ? "PIN needed - reload" : x.responseText || "failed"));
        x.onerror = () => res("connection lost");
        x.send(fd);
      });
      label.textContent += ok ? " - " + ok : " - done";
      label.className = "small " + (ok ? "st err" : "st ok");
    }
    route();
  }
  const ask = (msg, def) => { const v = prompt(msg, def); return v && v.trim() && !v.includes("/") ? v.trim() : null; };
  main.replaceChildren(
    h("div", { class: "row", style: "margin-bottom:.4rem" }, h("h2", { style: "margin:0" }, "Files"), h("span", { class: "grow" }),
      h("button", { onclick: async () => { const n = ask("New folder name"); if (n) { await post("mkdir", path + "/" + n); route(); } } }, "New folder"),
      h("button", { onclick: async () => { const n = ask("New file name", "new.txt"); if (n) { await putText(path + "/" + n, ""); go("edit", ...rel(path + "/" + n).split("/")); } } }, "New file"),
      h("button", { class: "primary", onclick: () => fileInput.click() }, "Upload"), fileInput),
    crumbs, drop, prog,
    h("table", { class: "files" }, h("tbody", {},
      path !== "/gmtools" ? h("tr", {}, h("td", { colspan: 3 }, h("a", { href: link(path.slice(0, path.lastIndexOf("/"))) }, "← up"))) : null,
      listing.map(f => {
        const full = path + "/" + f.n;
        const editable = !f.d && TEXT_EXT.test(f.n);
        return h("tr", {},
          h("td", {}, f.d ? h("a", { href: link(full) }, "📁 " + f.n)
            : editable ? h("a", { href: "#edit/" + rel(full).split("/").map(enc).join("/") }, f.n) : f.n),
          h("td", { class: "sz" }, f.d ? "" : kb(f.s)),
          h("td", { class: "act" },
            f.d ? null : h("a", { class: "icon", href: `/api/file?path=${enc(full)}&dl=1&t=${token}`, title: "Download" }, h("button", { class: "icon" }, "⬇")),
            h("button", { class: "icon", title: "Rename", onclick: async () => {
              const n = ask("Rename to", f.n);
              if (n && n !== f.n) { try { await post("mv", full, "&to=" + enc(path + "/" + n)); } catch (e) { alert(e.message); } route(); }
            } }, "✎"),
            h("button", { class: "icon danger", title: "Delete", onclick: async () => {
              if (!confirm(`Delete ${f.n}${f.d ? " and everything in it" : ""}?`)) return;
              await post("rm", full); route();
            } }, "✕")));
      }),
      !listing.length ? h("tr", {}, h("td", { class: "muted" }, "Empty folder")) : null)));
}

async function viewEdit(main, parts) {
  const path = "/gmtools/" + parts.join("/");
  const dir = parts.slice(0, -1);
  const size = ((await ls("/gmtools" + (dir.length ? "/" + dir.join("/") : ""))).find(f => f.n === parts[parts.length - 1]) || {}).s || 0;
  const back = h("a", { href: "#files/" + dir.map(enc).join("/") }, "← " + (dir.length ? dir[dir.length - 1] : "gmtools"));
  if (size > 64 * 1024) {
    main.replaceChildren(h("div", { class: "row" }, back), h("div", { class: "card", style: "margin-top:.6rem" },
      `${parts[parts.length - 1]} is ${kb(size)} - too big to edit here. `, h("a", { href: `/api/file?path=${enc(path)}&dl=1&t=${token}` }, "Download it"), " instead."));
    return;
  }
  const ta = h("textarea", { class: "code", spellcheck: "false" });
  ta.value = await getText(path);
  const status = h("span", { class: "st" });
  const s = makeSaver(() => putText(path, ta.value), status);
  ta.addEventListener("input", () => s.touch());
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("\t", ta.selectionStart, ta.selectionEnd, "end"); s.touch(); }
  });
  main.replaceChildren(h("div", { class: "row toolbar" }, back, h("b", { class: "grow" }, parts[parts.length - 1]), status,
    h("button", { onclick: () => s.flush() }, "Save")), ta);
  if (/\.(txt|idx)$/.test(path) && parts[0] === "srd")
    main.insertBefore(h("div", { class: "card small", style: "margin-bottom:.5rem;border-color:var(--gold-dk)" },
      "SRD data files are indexed by byte offset (the .idx file). Editing a .txt here shifts later records - regenerate both with tools/srd_extract.py instead."), ta);
}

async function viewDevice(main) {
  const st = await api("/api/status").then(r => r.json());
  const ssid = h("input", { type: "text", value: st.saved, placeholder: "Network name (empty = hotspot only)" });
  const pass = h("input", { type: "password", placeholder: "Password" });
  const msg = h("span", { class: "st" });
  main.replaceChildren(h("h2", {}, "WiFi"),
    h("div", { class: "card", style: "margin-bottom:1rem" },
      h("dl", { class: "entry", style: "display:grid;grid-template-columns:max-content 1fr;gap:.2rem 1rem;margin:0" },
        h("dt", { class: "muted" }, "Connected via"), h("dd", {}, st.mode === "hotspot" ? `its own hotspot "${st.network}"` : `"${st.network}"`),
        h("dt", { class: "muted" }, "Address"), h("dd", {}, st.ip + (st.mode === "hotspot" ? "" : "  (or http://dnd.local)")),
        h("dt", { class: "muted" }, "SD card"), h("dd", {}, st.sd ? "OK" : "missing"),
        h("dt", { class: "muted" }, "Free memory"), h("dd", {}, kb(st.heap)))),
    h("h3", {}, "Foundry VTT link key"),
    h("p", { class: "muted small" }, "Paste this into Foundry: Game Settings > Configure Settings > Cardputer Link > Link key."),
    h("div", { class: "row", style: "margin-bottom:1rem" },
      h("code", { style: "font-size:1.3rem;padding:.3rem .6rem;border:1px solid var(--edge, #555);border-radius:6px;user-select:all" }, st.fkey || "-"),
      h("button", { onclick: async ev => { try { await navigator.clipboard.writeText(st.fkey); ev.target.textContent = "Copied"; } catch (e) { ev.target.textContent = "Select and copy it"; } } }, "Copy")),
    h("h3", {}, "Home network"),
    h("p", { class: "muted small" }, "Web access joins this network when started, and falls back to its own hotspot if it can't. Changes apply the next time you start web access on the Cardputer."),
    h("form", { class: "list", style: "max-width:420px", onsubmit: async ev => {
      ev.preventDefault();
      try { await api("/api/wifi", { method: "POST", body: ssid.value.trim() + "\n" + pass.value }); msg.textContent = "Saved"; msg.className = "st ok"; }
      catch (e) { msg.textContent = e.message; msg.className = "st err"; }
    } }, ssid, pass, h("div", { class: "row" }, h("button", { class: "primary" }, "Save"), msg)));
  if (hasApp("Settings")) main.append(await settingsCards());
}
async function settingsCards() {
  let S = await app("Settings", "state");
  const box = h("div", {}), msg = h("span", { class: "st" });
  async function call(op, args) { try { S = await app("Settings", op, args); render(); } catch (e) { flash(msg, e.message, false); } }
  function render() {
    const now = new Date();
    box.replaceChildren(h("h3", { style: "margin-top:1.2rem" }, "Date & time"),
      h("div", { class: "card", style: "max-width:560px" },
        h("div", { class: "row" }, h("span", { class: "dtotal", style: "font-size:2.4rem" }, S.valid ? S.time : "--:--"), h("span", {}, S.valid ? S.date : "Not set"), msg),
        h("div", { class: "muted small" }, S.syncing ? "Asking the internet…" : S.syncedAgo >= 0 ? `Set from the internet ${S.syncedAgo} min ago` : "Sets itself from the internet when web access joins your WiFi."),
        h("div", { class: "row", style: "margin-top:.6rem" },
          h("label", {}, "Time zone ", h("select", { style: "width:auto", onchange: ev => call("zone", { i: ev.target.value }) }, S.zones.map((z, i) => h("option", { value: i, selected: S.zone === i }, z)))),
          h("button", { onclick: () => call("time", { y: now.getFullYear(), mo: now.getMonth() + 1, d: now.getDate(), h: now.getHours(), mi: now.getMinutes(), s: now.getSeconds() }) }, "Use this device's time"),
          h("button", { onclick: () => call("sync") }, "Ask the internet"))),
      h("h3", { style: "margin-top:1.2rem" }, "Sound & screen"),
      h("div", { class: "card list", style: "max-width:560px" },
        h("label", { class: "row" }, h("span", { style: "width:7rem" }, "Volume"), h("input", { type: "range", min: 0, max: 255, value: S.volume, class: "grow", onchange: ev => call("set", { volume: ev.target.value }) })),
        h("label", { class: "row" }, h("span", { style: "width:7rem" }, "Brightness"), h("input", { type: "range", min: 10, max: 255, value: S.brightness, class: "grow", onchange: ev => call("set", { brightness: ev.target.value }) })),
        S.timeouts ? h("label", { class: "row" }, h("span", { style: "width:7rem" }, "Screen timeout"),
          h("select", { style: "width:auto", onchange: ev => call("set", { timeout: ev.target.value }) },
            S.timeouts.map(t => h("option", { value: t, selected: S.timeout === t }, !t ? "Never" : t < 60 ? t + " seconds" : t / 60 + (t === 60 ? " minute" : " minutes"))))) : null,
        S.kbLights != null ? h("label", { class: "row" }, h("span", { style: "width:7rem" }, "Keyboard lights"),
          h("select", { style: "width:auto", onchange: ev => call("set", { kbLights: ev.target.value }) },
            ["Off", "Dim", "Normal"].map((t, i) => h("option", { value: i, selected: S.kbLights === i }, t)))) : null,
        h("label", {}, h("input", { type: "checkbox", checked: S.sound, onchange: ev => call("set", { sound: ev.target.checked ? 1 : 0 }) }), " Sound effects"),
        h("label", {}, h("input", { type: "checkbox", checked: S.logRolls, onchange: ev => call("set", { logRolls: ev.target.checked ? 1 : 0 }) }), " Keep a log of every roll on the card")));
  }
  render();
  return box;
}
